name="polyroute-master-proxy"
main="src/index.js"
compatibility_date="2026-09-05"
# آدرس عمومی workers.dev برای راوتر فعال باشد (کلید گیت‌وی آن را محافظت می‌کند)
workers_dev=true
preview_urls=false

[placement]
mode="smart"

[[services]]
binding="BAI_WORKER"
service="polyroute-provider-bai"

[[services]]
binding="DAHL_WORKER"
service="polyroute-provider-dahl"

[vars]
ENVIRONMENT="production"
MAX_BODY_BYTES="10485760"

[secrets]
required=["ROUTER_API_KEY"]
