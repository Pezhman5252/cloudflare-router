name = "omniroute-provider-bai"
main = "src/index.js"
compatibility_date = "2026-09-04"
workers_dev = false
# آدرس‌های preview هم غیرفعال بماند — این Worker فقط از طریق سرویس‌بایندینگِ
# Router قابل دسترس باشد و هیچ ورودی عمومی (حتی آزمایشی) نداشته باشد.
preview_urls = false

[placement]
mode = "smart"

[vars]
UPSTREAM_BASE_URL = "https://api.b.ai/v1"
AUTH_MODE = "bearer"
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "KV_USAGE"
id = "your-kv-namespace-id"   # 👈 پس از ایجاد KV، این id را جایگزین کنید

[secrets]
required = ["UPSTREAM_API_KEYS"]