name = "omniroute-provider-dahl"
main = "src/index.js"
compatibility_date = "2026-09-04"
workers_dev = false

[placement]
mode = "smart"

[vars]
UPSTREAM_BASE_URL = "https://inference.dahl.global/v1"
AUTH_MODE = "bearer"
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "KV_USAGE"
id = "your-kv-namespace-id"   # 👈 پس از ایجاد KV، این id را جایگزین کنید

[secrets]
required = ["UPSTREAM_API_KEYS"]